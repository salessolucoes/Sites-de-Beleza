<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vitrine Barbearia &amp; Salão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Seis modelos de site com agendamento, vitrine de trabalhos e loja para barbearias e salões de beleza.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo:wght@400;600;700&family=Barlow:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Italiana&family=Jost:wght@300;400;500&family=Manrope:wght@400;600;700&family=Nunito+Sans:wght@400;700&family=Syne:wght@600;700;800&display=swap">
<style>
/* Layout: a vitrine com abas em cima; abaixo, cada modelo é um site completo com a própria identidade. */
:root{
  --bg:#f3f2f4; --panel:#ffffff; --fg:#19171c; --muted:#615c68; --line:#dcd9e0; --accent:#5b3fd1; --accent-ink:#ffffff;
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131216;--panel:#1c1a21;--fg:#eeecf2;--muted:#a29dab;--line:#2f2c36;--accent:#a493ff;--accent-ink:#141218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131216;--panel:#1c1a21;--fg:#eeecf2;--muted:#a29dab;--line:#2f2c36;--accent:#a493ff;--accent-ink:#141218;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Vitrine ---------- */
.v-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
.v-top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.v-brand{font-weight:700;letter-spacing:.01em;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.v-brand small{font-weight:400;color:var(--muted)}
.v-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.v-tabs::-webkit-scrollbar{display:none}
.v-group{display:flex;align-items:center;gap:4px;padding-right:6px;border-right:1px solid var(--line)}
.v-group:last-child{border-right:0}
.v-group > span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 4px;white-space:nowrap}
.v-tab{border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:14px}
.v-tab:hover{border-color:var(--line)}
.v-tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.v-info{max-width:1240px;margin:0 auto;padding-block:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end}
.v-info h1{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.v-info p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.v-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.v-chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);white-space:nowrap}
.v-chip b{font-weight:700;color:var(--accent)}
.v-frame{max-width:1240px;margin:0 auto 48px;border-radius:14px;overflow:clip;border:1px solid var(--line);box-shadow:0 20px 50px -30px rgba(0,0,0,.45)}
.v-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.v-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.v-bar .url{margin-left:8px;padding:3px 10px;border-radius:6px;background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.v-outer{margin-inline:max(16px,env(safe-area-inset-left,0px))}
@media (max-width:720px){.v-info{grid-template-columns:1fr}.v-chips{justify-content:flex-start}}

/* ---------- Página de segurança ---------- */
.sec{max-width:1040px;margin:0 auto;padding-block:8px 64px;display:grid;gap:20px}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.sec-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.sec-card h3{margin:0 0 10px;font-size:16px}
.sec-card ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--fg)}
.sec-card li span{color:var(--muted)}
.sec-card code,.sec pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.sec pre{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto;margin:0;white-space:pre}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:6px}
.tag.ok{background:color-mix(in srgb,#1f9d61 18%,transparent);color:#1f9d61}
.tag.warn{background:color-mix(in srgb,#d08a00 20%,transparent);color:#b07400}

/* ---------- Site (cada modelo define suas variáveis) ---------- */
.site{--r:6px;background:var(--s-bg);color:var(--s-ink);font-family:var(--s-body);position:relative;overflow-x:clip}
.site *{box-sizing:border-box}
.site a{color:inherit}
.s-in{max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.s-sec{padding-block:72px}
.s-sec.alt{background:var(--s-surface)}
.s-eyebrow{font-family:var(--s-body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--s-accent);font-weight:700;margin:0 0 10px}
.s-h2{font-family:var(--s-display);font-weight:var(--s-dw,400);font-size:clamp(30px,4.4vw,48px);line-height:1.04;margin:0 0 14px;text-wrap:balance;letter-spacing:var(--s-dls,0)}
.s-lead{color:var(--s-muted);max-width:56ch;margin:0;font-size:16px}
.s-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:34px}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--s-accent);background:var(--s-accent);color:var(--s-accent-ink);padding:12px 20px;border-radius:var(--r);font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;letter-spacing:.02em;transition:transform .15s,filter .15s}
.s-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.s-btn.ghost{background:transparent;color:var(--s-ink);border-color:var(--s-line)}
.s-btn.sm{padding:8px 14px;font-size:13px}
.s-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.site :focus-visible{outline:2px solid var(--s-accent);outline-offset:2px}

/* imagem com fundo próprio: se a foto não carregar, o bloco continua bonito */
.ph{margin:0;position:relative;overflow:hidden;background:var(--s-ph);border-radius:var(--r);isolation:isolate}
.ph img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
.ph.noimg img{display:none}
.ph.noimg::after{content:attr(data-label);position:absolute;inset:auto 12px 12px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--s-ph-ink);opacity:.9}
.ph.noimg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--s-ph-ink) 9%,transparent) 14px 15px)}

/* nav */
.s-nav{position:relative;z-index:3;border-bottom:1px solid var(--s-line)}
.s-nav .s-in{display:flex;align-items:center;gap:22px;min-height:68px;flex-wrap:wrap;padding-block:10px}
.s-logo{font-family:var(--s-display);font-size:24px;font-weight:var(--s-dw,400);text-decoration:none;letter-spacing:var(--s-dls,0);line-height:1;margin-right:auto;display:flex;align-items:center;gap:10px}
.s-logo .mk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--s-accent);display:grid;place-items:center;font-size:15px;color:var(--s-accent)}
.s-links{display:flex;gap:20px;font-size:14px;flex-wrap:wrap}
.s-links button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--s-muted)}
.s-links button:hover{color:var(--s-ink)}
.s-open{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--s-muted);white-space:nowrap}
.s-open i{width:8px;height:8px;border-radius:50%;background:#2fb36b;box-shadow:0 0 0 3px color-mix(in srgb,#2fb36b 25%,transparent)}
.s-open.closed i{background:#d0533f;box-shadow:0 0 0 3px color-mix(in srgb,#d0533f 25%,transparent)}
@media (max-width:820px){.s-links{display:none}}

/* hero */
.s-hero{position:relative}
.h-overlay{min-height:560px;display:flex;align-items:flex-end}
.h-overlay > .ph{position:absolute;inset:0;border-radius:0;z-index:0}
.h-overlay > .ph.noimg::after{display:none}
.h-overlay::after{content:"";position:absolute;inset:0;background:var(--s-hero-shade);z-index:1}
.h-overlay .s-in{position:relative;z-index:2;padding-block:120px 64px;width:100%}
.h-title{font-family:var(--s-display);font-weight:var(--s-dw,400);font-size:clamp(40px,7vw,84px);line-height:.98;margin:0 0 18px;max-width:14ch;text-wrap:balance;letter-spacing:var(--s-dls,0)}
.h-sub{font-size:17px;color:var(--s-muted);max-width:48ch;margin:0 0 26px}
.h-ctas{display:flex;gap:10px;flex-wrap:wrap}
.h-meta{display:flex;flex-wrap:wrap;gap:22px;margin-top:34px;font-size:13px;color:var(--s-muted)}
.h-meta b{display:block;font-family:var(--s-display);font-size:26px;color:var(--s-ink);font-weight:var(--s-dw,400);line-height:1.1}
.h-split .s-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:72px}
.h-split .pics{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:220px 220px;gap:12px}
.h-split .pics .ph:first-child{grid-row:span 2}
.h-edit .s-in{padding-block:64px 0}
.h-edit .h-title{max-width:none;font-size:clamp(44px,9vw,128px);line-height:.92}
.h-edit .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:36px}
.h-edit .strip{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:12px;height:360px}
@media (max-width:860px){
  .h-split .s-in{grid-template-columns:1fr}
  .h-split .pics{grid-template-rows:170px 170px}
  .h-edit .row{grid-template-columns:1fr}
  .h-edit .strip{grid-template-columns:1fr 1fr;height:auto;grid-auto-rows:180px}
  .h-edit .strip .ph:first-child{grid-column:span 2}
  .h-overlay{min-height:480px}
}
.marquee{overflow:hidden;border-block:1px solid var(--s-line);background:var(--s-accent);color:var(--s-accent-ink)}
.marquee div{display:flex;gap:28px;white-space:nowrap;padding-block:12px;font-family:var(--s-display);font-size:22px;letter-spacing:.04em;animation:mq 26s linear infinite;width:max-content}
@keyframes mq{to{transform:translateX(-50%)}}

/* serviços */
.svc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--s-line);background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--s-muted)}
.chip[aria-pressed="true"]{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
.svc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:0 40px}
.svc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:18px 0;border-bottom:1px solid var(--s-line);align-items:center}
.svc h4{margin:0;font-size:17px;font-weight:700}
.svc p{margin:0;color:var(--s-muted);font-size:13.5px}
.svc .pr{font-family:var(--s-display);font-size:22px;font-weight:var(--s-dw,400);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.svc .pr small{display:block;font-family:var(--s-body);font-size:11px;color:var(--s-muted);letter-spacing:.04em}
.svc .go{grid-column:2;justify-self:end}
.svc .meta{grid-column:1}

/* galeria */
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:210px;gap:12px}
.gal .ph:nth-child(1){grid-column:span 2;grid-row:span 2}
.gal .ph:nth-child(6){grid-column:span 2}
.gal figcaption{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12px;background:color-mix(in srgb,var(--s-bg) 82%,transparent);backdrop-filter:blur(4px);padding:4px 10px;border-radius:999px;color:var(--s-ink)}
.ph.noimg figcaption{display:none}
.gal .ph[hidden]{display:none}
@media (max-width:820px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:160px}.gal .ph:nth-child(6){grid-column:span 1}}

/* antes e depois */
.ba{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--s-ph)}
.ba .ph{position:absolute;inset:0;border-radius:0}
.ba .after{clip-path:inset(0 0 0 var(--cut,50%))}
.ba .line{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:#fff;z-index:3;pointer-events:none;box-shadow:0 0 12px rgba(0,0,0,.4)}
.ba .lb{position:absolute;top:12px;z-index:3;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:999px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:4;margin:0}
.ba-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:40px;align-items:center}
@media (max-width:820px){.ba-wrap{grid-template-columns:1fr}}

/* equipe */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:18px}
.pro .ph{aspect-ratio:4/5;max-width:100%;margin-bottom:12px}
.pro h4{margin:0;font-size:17px}
.pro p{margin:2px 0 10px;color:var(--s-muted);font-size:13.5px}

/* planos */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.plan{border:1px solid var(--s-line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px;background:var(--s-bg)}
.plan.hot{border-color:var(--s-accent);box-shadow:0 0 0 1px var(--s-accent) inset}
.plan h4{margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.plan .big{font-family:var(--s-display);font-size:42px;line-height:1;font-weight:var(--s-dw,400);font-variant-numeric:tabular-nums}
.plan .big small{font-family:var(--s-body);font-size:14px;color:var(--s-muted)}
.plan ul{margin:0;padding-left:18px;color:var(--s-muted);font-size:14px;display:grid;gap:4px;flex:1}

/* fidelidade */
.loyal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.card-stamps{border:1px dashed var(--s-accent);border-radius:calc(var(--r) + 6px);padding:26px;background:var(--s-bg)}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--s-line);display:grid;place-items:center;font-size:12px;color:var(--s-muted)}
.stamp.on{background:var(--s-accent);border-color:var(--s-accent);color:var(--s-accent-ink);font-weight:700}
@media (max-width:820px){.loyal{grid-template-columns:1fr}}

/* quiz */
.quiz{border:1px solid var(--s-line);border-radius:var(--r);padding:24px;background:var(--s-bg);display:grid;gap:14px}
.quiz .q{display:flex;flex-wrap:wrap;gap:8px}
.quiz .res{border-top:1px solid var(--s-line);padding-top:14px;min-height:48px}

/* loja */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:18px}
.prod{display:flex;flex-direction:column;gap:8px}
.prod .ph{aspect-ratio:1;max-width:100%}
.prod h4{margin:4px 0 0;font-size:15px}
.prod p{margin:0;font-size:13px;color:var(--s-muted)}
.prod .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.prod .price{font-weight:700;font-variant-numeric:tabular-nums}
.cart{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--s-line);border-radius:var(--r);padding:14px 18px;background:var(--s-bg)}
.cart .sum{font-variant-numeric:tabular-nums}
.cart .sum b{font-size:18px}

/* gift card */
.gift{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.gift-card{aspect-ratio:1.6;max-width:100%;border-radius:16px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,var(--s-ink),color-mix(in srgb,var(--s-ink) 70%,var(--s-accent)));color:var(--s-bg)}
.gift-card .v{font-family:var(--s-display);font-size:44px;line-height:1}
@media (max-width:820px){.gift{grid-template-columns:1fr}}

/* avaliações */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px}
.rev{border-top:2px solid var(--s-accent);padding-top:16px}
.rev .st{color:var(--s-accent);letter-spacing:2px}
.rev p{margin:8px 0;font-size:15px}
.rev small{color:var(--s-muted)}

/* agendamento */
.book{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.bk-step{border:1px solid var(--s-line);border-radius:var(--r);padding:20px;background:var(--s-bg);display:grid;gap:12px}
.bk-step + .bk-step{margin-top:14px}
.bk-step h4{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.bk-step h4 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--s-accent);color:var(--s-accent-ink);display:grid;place-items:center;font-size:12px}
.fld{display:grid;gap:6px;font-size:13px;color:var(--s-muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--s-surface);border:1px solid var(--s-line);border-radius:calc(var(--r) - 2px);padding:11px 12px;color:var(--s-ink);font-size:15px}
.fld textarea{min-height:76px;resize:vertical}
.fld .err{color:#e0563f;font-size:12px;min-height:1em}
.fld input[aria-invalid="true"]{border-color:#e0563f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:64px;border:1px solid var(--s-line);background:var(--s-surface);border-radius:calc(var(--r) - 2px);padding:8px 6px;text-align:center;cursor:pointer;line-height:1.2}
.day small{display:block;font-size:11px;color:var(--s-muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font-size:18px}
.day[aria-pressed="true"],.slot[aria-pressed="true"]{background:var(--s-accent);color:var(--s-accent-ink);border-color:var(--s-accent)}
.day[aria-pressed="true"] small{color:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.slot{border:1px solid var(--s-line);background:var(--s-surface);border-radius:calc(var(--r) - 2px);padding:8px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.pros{display:flex;gap:8px;flex-wrap:wrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--s-muted)}

const tabsEl = document.getElementById("tabs"), stage = document.getElementById("stage"), info = document.getElementById("info");
function buildTabs() {
  const groups = {};
  MODELS.forEach((m, i) => (groups[m.group] ||= []).push([m, i + 1]));
  let html = "";
  for (const g in groups) html += `<div class="v-group"><span>${esc(g)}</span>${groups[g].map(([m, n]) => `<button class="v-tab" role="tab" data-id="${m.id}" aria-selected="false">${n}. ${esc(m.tab)} <small style="opacity:.6">· ${esc(m.tier)}</small></button>`).join("")}</div>`;
  html += `<div class="v-group"><button class="v-tab" role="tab" data-id="seguranca" aria-selected="false">Segurança e extras</button></div>`;
  tabsEl.innerHTML = html;
  tabsEl.addEventListener("click", e => { const b = e.target.closest(".v-tab"); if (b) show(b.dataset.id, true); });
}

function isOpen(h) {
  const d = new Date(), day = d.getDay(), hr = d.getHours() + d.getMinutes() / 60;
  if (h.closed.includes(day)) return [false, "Fechado hoje"];
  const close = day === 6 ? h.sat : h.close;
  if (hr >= h.open && hr < close) return [true, `Aberto agora · fecha às ${close}h`];
  return [false, hr < h.open ? `Abre hoje às ${h.open}h` : "Fechado · abre amanhã"];
}

function heroHTML(m) {
  const ctas = `<div class="h-ctas"><button class="s-btn" data-go="agendar">Agendar horário</button><button class="s-btn ghost" data-go="servicos">Ver serviços e preços</button></div>`;
  const meta = m.meta ? `<div class="h-meta">${m.meta.map(([a, b]) => `<div><b>${esc(a)}</b>${esc(b)}</div>`).join("")}</div>` : "";
  const head = `<p class="s-eyebrow">${esc(m.eyebrow)}</p><h1 class="h-title">${esc(m.title)}</h1>`;
  if (m.hero === "overlay") return `<section class="s-hero h-overlay">${ph(m.heroImg, m.title, "", 1800)}<div class="s-in">${head}<p class="h-sub">${esc(m.sub)}</p>${ctas}${meta}</div></section>`;
  if (m.hero === "split") return `<section class="s-hero h-split"><div class="s-in"><div>${head}<p class="h-sub">${esc(m.sub)}</p>${ctas}${meta}</div><div class="pics">${m.pics.map((p, i) => ph(p, m.gallery[i] ? m.gallery[i][1] : m.title, "", i ? 600 : 1000)).join("")}</div></div></section>`;

  if (full) h += `<section class="s-sec" data-sec="loja"><div class="s-in"><div class="s-head"><div><p class="s-eyebrow">Loja</p><h2 class="s-h2">Leve o cuidado para casa</h2></div><p class="s-lead">Separe os produtos e retire no dia do seu horário, ou peça entrega pelo WhatsApp.</p></div><div class="shop">${m.shop.map(([img, n, d, p], i) => `<div class="prod">${ph(img, n, "", 500)}<h4>${esc(n)}</h4><p>${esc(d)}</p><div class="row"><span class="price">${brl(p)}</span><button class="s-btn sm" data-add="${i}">Adicionar</button></div></div>`).join("")}</div><div class="cart" id="cart-${m.id}"><span class="sum">Sacola vazia</span><button class="s-btn sm" data-checkout disabled>Finalizar pelo WhatsApp</button></div></div></section>`;
  h += `<section class="s-sec alt" data-sec="avaliacoes"><div class="s-in"><div class="s-head"><div><p class="s-eyebrow">Avaliações</p><h2 class="s-h2">Quem já veio, volta</h2></div></div><div class="revs">${m.reviews.map(([t, a]) => `<div class="rev"><span class="st" aria-label="5 estrelas">★★★★★</span><p>“${esc(t)}”</p><small>${esc(a)} · Google</small></div>`).join("")}</div></div></section>`;
  h += bookingHTML(m);
  h += `<footer class="s-foot"><div class="s-in"><div><h5>${esc(m.logo)}</h5><p>${esc(m.addr)}</p><p>${esc(m.insta)}</p></div><div><h5>Horários</h5><p>Seg a sex: ${m.hours.open}h às ${m.hours.close}h</p><p>Sábado: ${m.hours.open}h às ${m.hours.sat}h</p><p>${m.hours.closed.length ? "Fechado: " + m.hours.closed.map(d => ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"][d]).join(" e ") : "Aberto todos os dias"}</p></div><div><h5>Privacidade</h5><p>Seus dados são usados só para confirmar o horário (LGPD).</p><p>Site com HTTPS e sem cookies de rastreamento.</p></div></div></footer>`;
  h += `<div class="s-mbar"><button class="s-btn" data-go="agendar">Agendar horário</button><button class="wa-fab" data-go="agendar" aria-label="Agendar pelo WhatsApp">WhatsApp</button></div>`;
  return `<div class="site ${m.cls}" id="site-${m.id}">${h}</div>`;
}

      <div class="bk-step"><h4><i>3</i>Seus dados</h4><div class="two"><div class="fld"><label for="bk-name-${m.id}">Nome</label><input id="bk-name-${m.id}" name="name" autocomplete="name" maxlength="60" required placeholder="Seu nome"><span class="err" data-err="name"></span></div><div class="fld"><label for="bk-tel-${m.id}">WhatsApp</label><input id="bk-tel-${m.id}" name="tel" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="15" required placeholder="(11) 91234-5678"><span class="err" data-err="tel"></span></div></div><div class="fld"><label for="bk-obs-${m.id}">Observações (opcional)</label><textarea id="bk-obs-${m.id}" name="obs" maxlength="280" placeholder="Ex.: quero manter o comprimento"></textarea></div><div class="hp" aria-hidden="true"><label for="bk-web-${m.id}">Site</label><input id="bk-web-${m.id}" name="website" tabindex="-1" autocomplete="off"></div><label class="consent"><input type="checkbox" id="bk-ok-${m.id}" name="ok" required><span>Autorizo o uso do meu nome e WhatsApp só para confirmar este horário.</span></label><span class="err" data-err="ok" style="font-size:12px;color:#e0563f"></span></div>
    </div>
    <aside class="summary" aria-live="polite"><h4>Resumo</h4><dl class="sumdl"></dl><div class="tot"><span>Total estimado</span><span class="sumtot">${brl(0)}</span></div><button class="s-btn" type="submit">Revisar e confirmar</button><div class="okarea"></div><span class="note">Pagamento no local: Pix, cartão ou dinheiro.</span></aside>
  </form></div></section>`;

/* ===== comportamento de cada site ===== */
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function wire(m) {
  const root = document.getElementById("site-" + m.id);
  const all = Object.values(m.cats).flat();
  const st = { svc: "", pro: "Qualquer profissional", day: null, slot: "", unit: m.units ? m.units[0][0] : "", cart: [], plan: "", lastSend: 0 };
  const f = root.querySelector("form.book");
  const $ = s => root.querySelector(s);

  // fotos que não carregam viram um bloco desenhado
  root.querySelectorAll(".ph img").forEach(img => {
    const fail = () => img.parentElement.classList.add("noimg");
    if (img.complete && img.naturalWidth === 0) fail(); else img.addEventListener("error", fail, { once: true });
  });

  const go = key => {
    const t = key === "top" ? root : root.querySelector(`[data-sec="${key}"]`);
    if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  };

  // filtros
  const filter = (group, sel) => group.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    group.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    root.querySelectorAll(sel).forEach(el => el.hidden = !(b.dataset.cat === "*" || el.dataset.cat === b.dataset.cat));
  });
  filter(root.querySelector('[data-sec="servicos"] .svc-tabs'), ".svc");
  filter(root.querySelector("[data-gal]"), ".gal .ph");

  // antes e depois
  const ba = root.querySelector(".ba input");
  if (ba) ba.addEventListener("input", () => ba.parentElement.style.setProperty("--cut", ba.value + "%"));

  // dias
  const daysEl = $(".days"), slotsEl = $(".slots");
  const days = []; const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  for (let i = 0; days.length < 12 && i < 30; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); if (!m.hours.closed.includes(d.getDay())) days.push(d); }
  const wd = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  daysEl.innerHTML = days.map((d, i) => `<button type="button" class="day" aria-pressed="false" data-i="${i}"><small>${i === 0 && d.getTime() === d0.getTime() ? "hoje" : wd[d.getDay()]}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "")}</small></button>`).join("");
  function renderSlots() {
    if (!st.day) { slotsEl.innerHTML = `<span class="note" style="grid-column:1/-1">Escolha um dia para ver os horários livres.</span>`; return; }
    const d = st.day, close = d.getDay() === 6 ? m.hours.sat : m.hours.close, now = new Date();
    let out = "";
    for (let t = m.hours.open * 60; t + m.slotMin <= close * 60; t += m.slotMin) {
      const hh = String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
      const dt = new Date(d); dt.setHours(0, t, 0, 0);
      const busy = hash(m.id + d.toDateString() + st.pro + hh) % 10 < 3 || dt <= now;
      out += `<button type="button" class="slot" aria-pressed="${st.slot === hh}" ${busy ? "disabled" : ""} data-t="${hh}">${hh}</button>`;
    }
    slotsEl.innerHTML = out || `<span class="note">Sem horários livres neste dia.</span>`;
  }
  daysEl.addEventListener("click", e => { const b = e.target.closest(".day"); if (!b) return; st.day = days[+b.dataset.i]; st.slot = ""; daysEl.querySelectorAll(".day").forEach(x => x.setAttribute("aria-pressed", x === b)); renderSlots(); summary(); });
  slotsEl.addEventListener("click", e => { const b = e.target.closest(".slot"); if (!b || b.disabled) return; st.slot = b.dataset.t; slotsEl.querySelectorAll(".slot").forEach(x => x.setAttribute("aria-pressed", x === b)); summary(); });
  const prosEl = $(".pros");
  const setPro = name => { st.pro = name; st.slot = ""; prosEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.p === name)); renderSlots(); summary(); };
  prosEl.addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setPro(b.dataset.p); });

  const svcSel = f.elements.svc;
  svcSel.addEventListener("change", () => { st.svc = svcSel.value; summary(); });
  if (f.elements.unit) f.elements.unit.addEventListener("change", () => { st.unit = f.elements.unit.value; summary(); });

  // máscara de telefone (só números, formato brasileiro)
  const tel = f.elements.tel;
  tel.addEventListener("input", () => {
    const v = tel.value.replace(/\D/g, "").slice(0, 11);
    tel.value = v.length > 6 ? `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}` : v.length > 2 ? `(${v.slice(0, 2)}) ${v.slice(2)}` : v;
  });

  // loja
  const cartEl = $("#cart-" + m.id);
  function renderCart() {
    if (!cartEl) { summary(); return; }
    const n = st.cart.length, tot = st.cart.reduce((a, i) => a + m.shop[i][3], 0);
    cartEl.querySelector(".sum").innerHTML = n ? `<b>${n} ${n > 1 ? "itens" : "item"}</b> · ${brl(tot)} <button type="button" class="s-btn sm ghost" data-clear style="margin-left:8px">Esvaziar</button>` : "Sacola vazia";
    cartEl.querySelector("[data-checkout]").disabled = !n;
    summary();
  }

  function summary() {
    const s = all.find(x => x[0] === st.svc);
    const prodTot = st.cart.reduce((a, i) => a + m.shop[i][3], 0);
    const rows = [m.units ? ["Unidade", st.unit] : null, ["Serviço", s ? s[0] : "—"], ["Profissional", st.pro], ["Dia", st.day ? st.day.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" }) : "—"], ["Horário", st.slot || "—"], st.cart.length ? ["Produtos", `${st.cart.length} na sacola · ${brl(prodTot)}`] : null, st.plan ? ["Interesse", "Plano " + st.plan] : null].filter(Boolean);
    const dl = $(".sumdl"); dl.textContent = "";
    rows.forEach(([k, v]) => { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); });
    $(".sumtot").textContent = brl((s ? s[3] : 0) + prodTot);
  }

  function waBox(title, msg) {
    const area = $(".okarea"); area.textContent = "";
    const box = document.createElement("div"); box.className = "ok-box";
    const h = document.createElement("b"); h.textContent = title;
    const pre = document.createElement("pre"); pre.textContent = msg;
    const link = document.createElement("a"); link.className = "s-btn"; link.target = "_blank"; link.rel = "noopener noreferrer";
    link.href = `https://wa.me/${m.wa}?text=${encodeURIComponent(msg)}`; link.textContent = "Enviar no WhatsApp";
    const copy = document.createElement("button"); copy.type = "button"; copy.className = "s-btn ghost sm"; copy.textContent = "Copiar mensagem";
    copy.addEventListener("click", () => {
      const done = () => { copy.textContent = "Mensagem copiada"; };
      if (navigator.clipboard) navigator.clipboard.writeText(msg).then(done, () => { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); });
    });
    const num = document.createElement("span"); num.className = "num"; num.textContent = `WhatsApp da casa: +${m.wa} (exemplo, troque pelo número real)`;
    box.append(h, pre, link, copy, num); area.append(box);
    $(".summary").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  const setErr = (k, t) => { const e = f.querySelector(`[data-err="${k}"]`); if (e) e.textContent = t; const inp = f.elements[k]; if (inp && inp.setAttribute) inp.setAttribute("aria-invalid", t ? "true" : "false"); };

  f.addEventListener("submit", e => {
    e.preventDefault();
    if (f.elements.website.value) return; // robô preencheu o campo escondido
    if (Date.now() - st.lastSend < 4000) return; // evita clique repetido
    const name = f.elements.name.value.replace(/[<>{}\[\]\\]/g, "").replace(/\s+/g, " ").trim();
    const digits = tel.value.replace(/\D/g, "");
    let ok = true;
    setErr("svc", st.svc ? "" : (ok = false, "Escolha um serviço."));
    setErr("slot", st.day && st.slot ? "" : (ok = false, "Escolha o dia e o horário."));
    setErr("name", /^[A-Za-zÀ-ÿ' .-]{2,60}$/.test(name) ? "" : (ok = false, "Digite seu nome (só letras)."));
    setErr("tel", /^[1-9]{2}9\d{8}$/.test(digits) ? "" : (ok = false, "Digite um celular com DDD, ex.: (11) 91234-5678."));
    setErr("ok", f.elements.ok.checked ? "" : (ok = false, "Marque a autorização para continuar."));
    if (!ok) { const first = f.querySelector('[aria-invalid="true"]') || f.querySelector(".err:not(:empty)"); if (first) first.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    st.lastSend = Date.now();
    const s = all.find(x => x[0] === st.svc);
    const obs = f.elements.obs.value.replace(/[<>]/g, "").trim().slice(0, 280);
    const lines = [`Olá, ${m.logo}! Quero confirmar um horário:`, "", m.units ? `Unidade: ${st.unit}` : null, `Serviço: ${s[0]} (${brl(s[3])})`, `Profissional: ${st.pro}`, `Dia: ${st.day.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" })} às ${st.slot}`, st.cart.length ? `Separar produtos: ${st.cart.map(i => m.shop[i][1]).join(", ")}` : null, st.plan ? `Tenho interesse no plano ${st.plan}` : null, obs ? `Obs.: ${obs}` : null, "", `Nome: ${name}`, `WhatsApp: ${tel.value}`].filter(x => x !== null);
    waBox("Pronto! Falta só enviar", lines.join("\n"));
  });

  // cliques gerais do site
  root.addEventListener("click", e => {
    const mb = e.target.closest("[data-menu]");
    if (mb) { const l = root.querySelector(".s-links"), o = !l.classList.contains("open"); l.classList.toggle("open", o); mb.setAttribute("aria-expanded", o); mb.textContent = o ? "✕" : "☰"; return; }
    if (e.target.closest(".s-links button")) { root.querySelector(".s-links").classList.remove("open"); const b = root.querySelector("[data-menu]"); b.textContent = "☰"; b.setAttribute("aria-expanded", "false"); }
    const st0 = e.target.closest("[data-story]");
    if (st0) { viewer(m, m.gallery, +st0.dataset.story, true); return; }
    const gf = e.target.closest(".gal .ph");
    if (gf) { const vis = [...root.querySelectorAll(".gal .ph:not([hidden])")]; const items = vis.map(f => m.gallery[[...root.querySelectorAll(".gal .ph")].indexOf(f)]); viewer(m, items, vis.indexOf(gf), false); return; }
    const t = e.target.closest("[data-go],[data-pick],[data-pro],[data-unit],[data-plan],[data-add],[data-clear],[data-checkout],[data-giftbuy]");
    if (!t) return;
    if (t.dataset.go) { e.preventDefault(); go(t.dataset.go); }
    if (t.dataset.pick) { svcSel.value = t.dataset.pick; st.svc = t.dataset.pick; summary(); go("agendar"); }
    if (t.dataset.pro) { setPro(t.dataset.pro); go("agendar"); }
    if (t.dataset.unit) { f.elements.unit.value = t.dataset.unit; st.unit = t.dataset.unit; summary(); go("agendar"); }
    if (t.dataset.plan) { st.plan = t.dataset.plan; summary(); go("agendar"); }
    if (t.dataset.add !== undefined) { st.cart.push(+t.dataset.add); t.textContent = "Adicionado ✓"; setTimeout(() => t.textContent = "Adicionar", 1200); renderCart(); }
    if (t.hasAttribute("data-clear")) { st.cart = []; renderCart(); }
    if (t.hasAttribute("data-checkout")) { const tot = st.cart.reduce((a, i) => a + m.shop[i][3], 0); waBox("Pedido da loja", `Olá, ${m.logo}! Quero comprar:\n\n${st.cart.map(i => `• ${m.shop[i][1]} (${brl(m.shop[i][3])})`).join("\n")}\n\nTotal: ${brl(tot)}\nPrefiro: retirar no salão / receber em casa`); }
    if (t.hasAttribute("data-giftbuy")) { const v = root.querySelector(`#gift-${m.id} [aria-pressed="true"]`).dataset.v; waBox("Pedido de vale-presente", `Olá, ${m.logo}! Quero um vale-presente de ${brl(+v)}.\nNome de quem vai receber: \nMensagem no cartão: `); }
  });

  const giftEl = root.querySelector(`#gift-${m.id}`);
  if (giftEl) giftEl.addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; giftEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); root.querySelector(`#gv-${m.id}`).textContent = brl(+b.dataset.v).replace(",00", ""); });

  // quiz
  const quiz = root.querySelector(`#quiz-${m.id}`);
  if (quiz) {
    const ans = [null, null, null];
    quiz.addEventListener("click", e => {
      const b = e.target.closest(".chip"); if (!b) return;
      const q = b.parentElement; ans[+q.dataset.q] = +b.dataset.v;
      q.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
      if (ans.includes(null)) return;
      const pick = ans[1] ? "Reconstrução" : ans[2] ? (ans[0] ? "Tonalização" : "Morena iluminada") : "Hidratação profunda";
      const why = { "Reconstrução": "Fio elástico ou quebrando pede reposição de massa antes de qualquer cor.", "Tonalização": "Cabelo já descolorido: o tonalizante muda o tom sem agredir.", "Morena iluminada": "Cabelo saudável e sem descoloração: dá para iluminar com segurança.", "Hidratação profunda": "Seco e sem brilho resolve com água e nutrição." }[pick];
      const res = quiz.querySelector(".res"); res.textContent = "";
      const b1 = document.createElement("b"); b1.textContent = "Indicação: " + pick;
      const p = document.createElement("p"); p.textContent = why; p.style.margin = "4px 0 10px"; p.className = "note";
      const btn = document.createElement("button"); btn.className = "s-btn sm"; btn.dataset.pick = pick; btn.textContent = "Agendar " + pick;
      res.append(b1, p, btn);
    });
  }

  renderSlots(); renderCart(); summary();
}

/* ===== visualizador de fotos e stories ===== */
function viewer(m, items, start, auto) {
  let i = start, timer = null;
  const ov = document.createElement("div"); ov.className = "lb-ov"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "Fotos");
  const draw = () => {
    clearTimeout(timer);
    const [id, t] = items[i];
    ov.innerHTML = `<div class="bars">${items.map((_, k) => `<i class="${k < i ? "done" : k === i && auto ? "run" : k === i ? "done" : ""}"><b></b></i>`).join("")}</div><div class="stage">${ph(id, t, "", 1400)}<div class="nav"><button type="button" aria-label="Foto anterior" data-d="-1"></button><button type="button" aria-label="Próxima foto" data-d="1"></button></div></div><div class="foot"><span>${esc(t)} · ${i + 1}/${items.length}</span><button class="x" type="button" data-x>Fechar</button></div>`;
    ov.querySelectorAll(".ph img").forEach(img => img.addEventListener("error", () => img.parentElement.classList.add("noimg"), { once: true }));
    if (auto) timer = setTimeout(() => step(1), 4000);
  };
  const close = () => { clearTimeout(timer); ov.remove(); document.removeEventListener("keydown", key); };
  const step = d => { i += d; if (i < 0) i = 0; if (i >= items.length) return close(); draw(); };
  const key = e => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); };
  ov.addEventListener("click", e => { if (e.target.closest("[data-x]")) return close(); const b = e.target.closest("[data-d]"); if (b) step(+b.dataset.d); });
  document.addEventListener("keydown", key);
  document.body.append(ov); draw(); ov.querySelector("[data-x]").focus();
}

function securityHTML() {

/* ===== troca de modelo ===== */
function show(id, scroll) {
  if (!MODELS.some(m => m.id === id) && id !== "seguranca") id = MODELS[0].id;
  tabsEl.querySelectorAll(".v-tab").forEach(t => t.setAttribute("aria-selected", t.dataset.id === id));
  store.set("vitrine-tab", id);
  if (id === "seguranca") {
    info.innerHTML = `<div><h1>Segurança e extras</h1><p>O que já está protegido nos modelos, o que ajustar ao publicar e o que dá para acrescentar.</p></div>`;
    stage.innerHTML = securityHTML();
  } else {
    const m = MODELS.find(x => x.id === id), n = MODELS.indexOf(m) + 1;
    info.innerHTML = `<div><h1>Modelo ${n} · ${esc(m.tab)}</h1><p>${esc(m.pitch)}</p></div><div class="v-chips"><span class="v-chip">Versão: <b>${esc(m.tier)}</b></span><span class="v-chip">Porte: <b>${esc(m.size)}</b></span>${m.feats.map(f => `<span class="v-chip">${esc(f)}</span>`).join("")}</div>`;
    stage.innerHTML = `<div class="v-outer"><div class="v-frame"><div class="v-bar"><i></i><i></i><i></i><span class="url">https://${esc(m.domain)}</span></div>${siteHTML(m)}</div></div>`;
    wire(m);
  }
  if (scroll) window.scrollTo({ top: 0 });
}

buildTabs();
const start = (location.hash || "").slice(1);
show(start || store.get("vitrine-tab") || MODELS[0].id, false);
window.addEventListener("hashchange", () => show(location.hash.slice(1), true));
</script>
